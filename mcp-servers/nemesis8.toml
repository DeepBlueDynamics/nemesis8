# nemesis8 — the gateway / control-plane MCP client (n8gw), native Rust binary at
# /usr/local/bin/n8gw, stdio. Lets an agent reach the host gateway (agent_list/
# spawn/kill, trigger_list, expose_port/unexpose_port) — graceful when the gateway
# is down. On by default; disable per-workspace via config `disabled_builtins`.
# Replaced nemesis8-orchestrator.py.
[server]
name = "nemesis8"
command = "/usr/local/bin/n8gw"
enabled_by_default = true
# n8gw authenticates to the gateway with this bearer token. Naming it here makes
# build_env forward the host value (keychain-first) into every container, and the
# stdio config-gen forward it into n8gw's own env block — past the provider's MCP
# env scrub. Not a request header (this is a stdio server); n8gw reads it from its
# env and sets its own `Authorization: Bearer`.
bearer_token_env = "NEMESIS8_AUTH_TOKEN"
