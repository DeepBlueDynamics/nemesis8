name: Release

permissions:
  contents: write
  actions: read # notify-discord reads this run's per-job conclusions

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: nemesis8
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: nemesis8
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: nemesis8.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: nemesis8
          - os: macos-14
            target: x86_64-apple-darwin
            artifact: nemesis8

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Sign (Windows)
        if: runner.os == 'Windows'
        # Azure Trusted Signing has been intermittently returning 403 / operation
        # status:Failed even with a healthy paid subscription + correct role.
        # Don't let a flaky signing service block the ENTIRE release (Linux +
        # macOS sign fine). On failure the Windows binary ships UNSIGNED — users
        # get a SmartScreen "unknown publisher" prompt until Azure recovers and
        # the next release signs cleanly. Mirrors the macOS graceful-skip below.
        continue-on-error: true
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: nuts-services
          certificate-profile-name: hyperia-signing
          files-folder: target/${{ matrix.target }}/release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign + notarize (macOS)
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # Graceful skip: if signing secrets aren't configured in this repo,
          # ship UNSIGNED rather than failing the release.
          if [ -z "${CSC_LINK:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "::warning::macOS signing secrets not set — shipping UNSIGNED."
            exit 0
          fi
          BIN="target/${{ matrix.target }}/release/nemesis8"
          # Import the Developer ID Application cert into a throwaway keychain.
          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          KP="$(openssl rand -base64 24)"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed 's/"//g')
          # Use whatever Developer ID Application identity the cert actually
          # carries (sign by its SHA-1) — don't hardcode the org CN.
          IDENTITY=$(security find-identity -v -p codesigning "$KC" | awk '/Developer ID Application/ {print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity in CSC_LINK cert."
            security find-identity -v -p codesigning "$KC" || true
            exit 1
          fi
          codesign --sign "$IDENTITY" --options runtime --timestamp --force --verbose "$BIN"
          codesign --verify --verbose=2 "$BIN"
          # Notarize. A bare CLI Mach-O can't be stapled (only .app/.dmg/.pkg),
          # so we submit a zip; Gatekeeper checks notarization online on first run.
          ( cd "$(dirname "$BIN")" && /usr/bin/zip -q "$RUNNER_TEMP/n8.zip" nemesis8 )
          xcrun notarytool submit "$RUNNER_TEMP/n8.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          security delete-keychain "$KC" || true
          echo "macOS binary signed + notarized."

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../nemesis8-${{ github.ref_name }}-${{ matrix.target }}.tar.gz ${{ matrix.artifact }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ matrix.artifact }} -DestinationPath ../../../nemesis8-${{ github.ref_name }}-${{ matrix.target }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: nemesis8-${{ github.ref_name }}-${{ matrix.target }}
          path: nemesis8-${{ github.ref_name }}-${{ matrix.target }}.*

  # Compile the in-container binaries (nemesis8-entry, nemesis8-monitor, and the
  # mcp-bins) and publish them as a release asset so `n8 build` can DOWNLOAD them
  # instead of recompiling (a multi-minute cargo build) on every build. Built via
  # the Dockerfile's `bins-tar` target — i.e. INSIDE nemesis8-base — so the
  # binaries' glibc matches the runtime image exactly; a bare-runner build could
  # link a newer glibc than the Debian base and fail at container start. Native
  # runners per arch (no QEMU). glint is NOT included (source-only, opt-in).
  container-bins:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      # Pull nemesis8-base (the builder's FROM). Login is harmless if it's public
      # and required if it isn't — either way the pull can't fail on auth.
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build + export container binaries
        run: |
          docker build --target bins-tar \
            --platform ${{ matrix.platform }} \
            --build-arg NEMESIS8_VERSION="${GITHUB_REF_NAME#v}" \
            -o type=local,dest=out .
          ls -la out
          tar czf "nemesis8-container-${{ matrix.arch }}.tar.gz" -C out .
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: nemesis8-container-${{ matrix.arch }}
          path: nemesis8-container-${{ matrix.arch }}.tar.gz

  release:
    needs: [build, container-bins]
    runs-on: ubuntu-latest
    steps:
      # Checkout the tagged commit so we can read release-notes.md — the single
      # source of truth for BOTH the release name and body. Its first "# "
      # heading is the name (e.g. "nemesis8 v0.25.0 — Hermes on the tunnel 🪽").
      - name: Checkout (for release-notes.md)
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      # Release name + body come from release-notes.md:
      #   - name = the first "# " heading
      #   - body = everything after it (GitHub shows the name above the body,
      #     so the heading isn't repeated)
      # If release-notes.md is missing (a quick tag with no notes), the name
      # falls back to "nemesis8 <tag>" and the body is empty — a release can
      # never publish as a bare version number with auto-generated filler.
      - name: Compose release name + body from release-notes.md
        id: relnotes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name=""
          : > release-body.md
          if [ -f release-notes.md ]; then
            name="$(sed -n 's/^#[[:space:]]\+//p' release-notes.md | head -n1)"
            # Body = file minus its first H1 line (+ a leading blank line).
            tail -n +2 release-notes.md | sed '1{/^[[:space:]]*$/d}' > release-body.md
          fi
          [ -z "${name// /}" ] && name="nemesis8 ${TAG}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "Release name → ${name}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          name: ${{ steps.relnotes.outputs.name }}
          body_path: release-body.md
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Post a single release summary to Discord with each build leg's status.
  # always() so it still fires when a leg (or the release) failed — a partial
  # release is exactly when the ping matters. Skips quietly when the Discord
  # secrets aren't configured, so a missing bot token never reddens a release.
  notify-discord:
    needs: [build, container-bins, release]
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Post release status to Discord
        env:
          # Discord bot API (not a webhook): posts as the bot into the channel.
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_BOT_TOKEN:-}" ] || [ -z "${DISCORD_CHANNEL_ID:-}" ]; then
            echo "DISCORD_BOT_TOKEN / DISCORD_CHANNEL_ID not set — skipping Discord post."
            exit 0
          fi

          # Every job's name + conclusion for THIS run. --jq streams objects;
          # jq -s collects them.
          jobs_json="$(gh api --paginate "repos/${REPO}/actions/runs/${RUN_ID}/jobs" \
            --jq '.jobs[] | {name, conclusion}' | jq -s '.')"

          emoji() {
            case "$1" in
              success)   printf '✅' ;;
              failure)   printf '❌' ;;
              cancelled) printf '⏹️' ;;
              skipped)   printf '⏭️' ;;
              *)         printf '❔' ;;
            esac
          }
          # Conclusion of the job whose name CONTAINS $1. Matrix legs are named
          # "build (ubuntu-latest, x86_64-unknown-linux-gnu, nemesis8)", so we
          # substring-match on the target triple / platform (unambiguous).
          conc() { echo "$jobs_json" | jq -r --arg n "$1" \
            'map(select(.name | contains($n))) | (.[0].conclusion // "unknown")'; }

          lin_x64="$(conc 'x86_64-unknown-linux-gnu')"
          lin_arm="$(conc 'aarch64-unknown-linux-gnu')"
          mac_arm="$(conc 'aarch64-apple-darwin')"
          mac_x64="$(conc 'x86_64-apple-darwin')"
          win="$(conc 'x86_64-pc-windows-msvc')"
          cb_amd="$(conc 'linux/amd64')"
          cb_arm="$(conc 'linux/arm64')"
          rel="$(conc 'release')"

          # green all-pass · red all-fail · gold mixed (over every build leg)
          passes=0; fails=0
          for c in "$lin_x64" "$lin_arm" "$mac_arm" "$mac_x64" "$win" "$cb_amd" "$cb_arm"; do
            if [ "$c" = success ]; then passes=$((passes+1)); else fails=$((fails+1)); fi
          done
          if   [ "$fails" -eq 0 ]; then color=3066993
          elif [ "$passes" -eq 0 ]; then color=15158332
          else color=15844367
          fi

          subject="$(printf '%s' "${COMMIT_MSG:-}" | head -n1)"
          release_url="https://github.com/${REPO}/releases/tag/${TAG}"

          payload="$(jq -n \
            --arg title "🚀 nemesis8 ${TAG}" \
            --arg url "$release_url" \
            --argjson color "$color" \
            --arg lin_x64 "$(emoji "$lin_x64") x64 — ${lin_x64}" \
            --arg lin_arm "$(emoji "$lin_arm") arm64 — ${lin_arm}" \
            --arg mac_arm "$(emoji "$mac_arm") Apple Silicon — ${mac_arm}" \
            --arg mac_x64 "$(emoji "$mac_x64") Intel — ${mac_x64}" \
            --arg win "$(emoji "$win") x64 — ${win}" \
            --arg cb "$(emoji "$cb_amd") amd64 — ${cb_amd} · $(emoji "$cb_arm") arm64 — ${cb_arm}" \
            --arg rel "$(emoji "$rel") ${rel}" \
            --arg footer "${SHA:0:7} — ${subject}" \
            '{embeds: [{
               title: $title, url: $url, color: $color,
               fields: [
                 {name: "Linux",          value: ($lin_x64 + "\n" + $lin_arm), inline: true},
                 {name: "macOS",          value: ($mac_arm + "\n" + $mac_x64), inline: true},
                 {name: "Windows",        value: $win,                          inline: true},
                 {name: "Container bins", value: $cb,                           inline: false},
                 {name: "Release",        value: $rel,                          inline: false}
               ],
               footer: {text: $footer}
             }]}')"

          curl -sf -X POST \
            -H "Authorization: Bot ${DISCORD_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "https://discord.com/api/v10/channels/${DISCORD_CHANNEL_ID}/messages"
          echo "Posted release status to Discord channel ${DISCORD_CHANNEL_ID}."
