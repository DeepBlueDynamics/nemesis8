# fx — Vercel Labs' tiny native coding agent (Zig, ~8 MiB binary).
# https://github.com/vercel-labs/fx
#
# Model-agnostic (local and cloud inference), MCP-capable, workspace
# AGENTS.md, native sessions (`fx sessions`, `fx session resume last`).
# Auth: `fx login codex` (ChatGPT OAuth, callback :1455 — wired below) or
# `fx setup` (AI Gateway key). fx's login is a browser redirect, no paste box.
#
# v1 wiring (verified against upstream docs 2026-08-19): install, launch,
# one-shot. TO PROBE on a live image, then wire:
#   - MCP config file location + format (fx DOES speak MCP — once found,
#     set format/mcp_key here and the built-in tool bench lights up)
#   - session store path (enables n8 session listing/resume; fx's resume is
#     subcommand-shaped: `fx session resume --id <id>`)
#   - danger/permission-mode flag (fx has permission modes; flag name TBD)
[provider]
name = "fx"
aliases = ["vercel-fx"]
emoji = "▲"
binary = "fx"

[provider.install]
kind = "curl"
url = "https://fx.sh/setup.sh"
binary_name = "fx"

[provider.config_dir]
# fx manages its own config; MCP wiring lands once its file is probed.
path = ".config/fx"
format = "none"
filename = ""

[provider.prompt]
# One-shot: fx ask "prompt"
exec_subcommand = "ask"

[provider.system_prompt]
persona = "You are fx, Vercel's native coding agent."
# Delivery deferred: fx reads workspace AGENTS.md; no global path documented.

[provider.model]
env_source = "CODEX_DEFAULT_MODEL"

[provider.api_keys]
optional = true

[provider.hooks]
supports_sessions = false

[provider.env_overrides]
HOME = "/opt/nemesis8"

[provider.login]
# fx auth is a BROWSER OAuth REDIRECT with no paste-a-code box, so the callback
# MUST reach the container. `fx login codex` binds 127.0.0.1:1455 and advertises
# redirect_uri http://localhost:1455/auth/callback (verified on a live image).
#
# The bridge binds socat to the container's eth0 IP (NOT 0.0.0.0): fx keeps
# 127.0.0.1:1455 for itself, socat takes <eth0>:1455 and forwards to it, and
# `-p 1455:1455` maps host:1455 -> eth0:1455. Binding socat to 0.0.0.0 is WRONG
# here — it swallows 127.0.0.1:1455, so fx fails over to :1457 (unpublished) and
# the forward points at a dead port. Creds land in ~/.fx/*-auth.json under
# HOME=/opt/nemesis8 (mounted data-home), so ONE login covers every fx session.
#
# Other fx auth routes (add their ports once probed on a live image):
#   fx login        -> Vercel AI Gateway OAuth (callback port TBD)
#   fx login grok   -> xAI OAuth (callback port TBD)
# No-callback alternative: `fx setup` with an AI Gateway API key.
command = """set -euo pipefail; export PATH="/usr/local/bin:${PATH}"; IP="$(hostname -i 2>/dev/null | awk '{print $1}')"; if [ -n "$IP" ]; then socat TCP-LISTEN:1455,bind="$IP",reuseaddr,fork TCP:127.0.0.1:1455 & bridge_pid=$!; trap 'kill "$bridge_pid" 2>/dev/null || true' EXIT INT TERM; fi; echo "[nemesis8] fx login (codex route): open the printed URL in your HOST browser; the callback on :1455 now reaches the container. Creds persist to ~/.fx and carry over to all fx sessions. Ctrl-C when done."; fx login codex"""
ports = ["1455:1455"]
callback_ports = [1455]
