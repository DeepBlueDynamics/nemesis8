# Hermes Agent — Nous Research's terminal AI agent (curl-installed `hermes`).
# Strong local-model harness with 40+ built-in tools, auto-discovers Ollama
# models, and runs headless via `-z/--oneshot`. NOTE: Hermes requires models
# with >=64k context — small models (e.g. gemma2:2b) are rejected at startup;
# pick a roomy local model (qwen3-coder, deepseek-*, the :cloud tags).
[provider]
name = "hermes"
aliases = ["nous"]
emoji = "🪽"
binary = "hermes"

[provider.install]
kind = "curl"
url = "https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh"
binary_name = "hermes"
# The current installer falls back to Node 24 on the bookworm base.
# Verified with Hermes v0.21.3; see tests/hermes for build/runtime checks.
default = true
# hermes's installer downloads Playwright + Chromium + xvfb (~290 MB) for its
# browser tools BY DEFAULT. Skip it to keep the image lean — hermes's 40+ other
# built-in tools still work; only browser automation is off. Drop this arg (or add
# a build flag) if/when we want hermes browser tooling.
#
# PINNED to a known-good upstream commit. The installer tracks `main`, but main is a
# rolling target — both d6d9e67f and 24fd22b9 report themselves as v0.21.3. Rev
# 24fd22b9 added a `file_signature(...)` call to hermes_cli/cli_tui_mixin.py WITHOUT
# importing it (file_signature lives in utils; other modules import it fine), so an
# interactive TUI launch dies with `NameError: file_signature is not defined`.
# Headless `-z` never enters the TUI, so it was unaffected — which is why headless
# smoke tests passed. d6d9e67f predates that call entirely (verified against the file
# at that rev). --force-commit so it rolls back from a newer main a prior install may
# hold. Re-pin forward once upstream fixes the missing import. NB: the installer's
# git fetch requires the FULL 40-char SHA (it rejects abbreviated ones);
# d6d9e67f = d6d9e67f54476b2d8fccb5ed51a3e91fc99b3d62.
args = ["--skip-browser", "--commit", "d6d9e67f54476b2d8fccb5ed51a3e91fc99b3d62", "--force-commit"]

[provider.config_dir]
# Hermes co-owns this YAML file. Preserve user settings across launches.
path = ".hermes"
format = "yaml"
filename = "config.yaml"
required = true
mcp_key = "mcp_servers"
mcp_http_style = "hermes"

# Register ollama as a NAMED custom provider so it shows in hermes's own /model
# picker (hermes only auto-detects providers it has API keys for; ollama has
# none). discover_models=true makes hermes fetch the live model list from the
# daemon. Plus default the session model.provider to ollama.
[provider.config_defaults.providers.ollama]
name = "Ollama (local)"
base_url = "http://host.docker.internal:11434/v1"
api_key = "ollama"
transport = "openai_chat"
discover_models = true

[provider.config_defaults.model]
provider = "ollama"
base_url = "http://host.docker.internal:11434/v1"

[provider.config_defaults.plugins]
enabled = ["nemesis8"]

[provider.system_prompt]
persona = "You are Hermes, Nous Research's coding agent running in Nemesis 8."
write_to_file = "SOUL.md"

[provider.prompt]
# Headless one-shot: `hermes -z "<prompt>"` (prints only the response).
exec_prompt_flag = "-z"

[provider.danger]
# Auto-approve all tool actions.
flag = "--yolo"

[provider.model]
# `hermes -m provider/model`. Local picks arrive as `ollama/<model>`
# (local_daemon_model_prefix), matching the configured ollama provider.
flag = "-m"
env_source = "CODEX_DEFAULT_MODEL"
# Modal lists the host daemon's models first (ollama/<id>). Hermes itself
# auto-discovers them at runtime, so there is NO [provider.local_models] block.
local_daemon_env = "OLLAMA_HOST"
local_daemon_default_url = "http://localhost:11434"
local_daemon_model_prefix = "ollama/"

[provider.validation]
flags = ["--model", "--resume", "--oneshot"]
danger_flags = ["--yolo"]

[provider.api_keys]
# Hermes is multi-provider; local ollama needs no key. Cloud keys (forwarded by
# build_env) / `hermes login` cover the rest.
optional = true

[provider.env_overrides]
HOME = "/opt/nemesis8"
HERMES_HOME = "/opt/nemesis8/.hermes"
# Container reaches the host daemon here; host-side modal falls back to localhost.
OLLAMA_HOST = "http://host.docker.internal:11434"

[provider.hooks]
supports_sessions = true
resume_flag = "--resume"
session_dirs = [".hermes"]
# Session store: sqlite db read by the "hermes" engine, guarded to .hermes.
session_db_file = "state.db"
session_db_parent = ".hermes"
session_db_reader = "hermes"

[provider.hooks.bundled_config_dirs]
"plugins/nemesis8" = "/opt/defaults/integrations/hermes/nemesis8"
